apply plugin: 'com.android.application'

// Version state lives in version.properties (committed) so a build can read
// it and the bumpVersionForNextBuild task can increment it after a
// successful release build without hand-editing this file - same scheme as
// the other FuZz apps. Release tags are "v<versionCode>" (see UpdateChecker).
def versionPropsFile = file("${rootDir}/version.properties")
def versionProps = new Properties()
versionProps.load(new FileInputStream(versionPropsFile))
def appVersionCode = project.hasProperty('testVersionCode')
        ? project.property('testVersionCode').toInteger()
        : versionProps['versionCode'].toInteger()
def appVersionMajor = versionProps['versionMajor'] ? versionProps['versionMajor'].toInteger() : 1
def appVersionName = "${appVersionMajor}." + String.format("%03d", appVersionCode)

// Resolves the current commit's short hash for the APK filename below.
// Same helper as FuzzBC/GadgetBridge's app/build.gradle.
final def getGitHashShort = { ->
    try {
        return providers.exec {
            commandLine('git', 'rev-parse', '--short', 'HEAD')
        }.standardOutput.asText.get().trim()
    } catch (ignored) {
        return null
    }
}

android {
    compileSdk 34
    namespace "com.fuzz.volumehu"

    defaultConfig {
        applicationId 'com.fuzz.volumehu'
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField "int", "VERSION_MAJOR", "${appVersionMajor}"
        signingConfig signingConfigs.debug
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            // Debug key, no separate release signature - same accepted
            // tradeoff as the other FuZz apps (sideloaded, not Play-listed).
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

}

// Build APK filename: <appname>-<buildType>-<dateTime>-<commit>.apk
// AGP 9's ApplicationExtension no longer exposes the legacy
// applicationVariants DSL at all (not just deprecated - fully removed), so
// this has to go through the modern Variant API instead.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            def dateTime = new Date().format('yyyyMMdd-HHmmss')
            def gitCommit = getGitHashShort()
            def commitSuffix = gitCommit ? "-${gitCommit}" : ""
            def appName = "FuZz_Volume_HU"
            def buildType = variant.buildType
            output.outputFileName.set("${appName}-${buildType}-${dateTime}${commitSuffix}.apk")
        }
    }
}

// Task to copy APKs to common build folder
tasks.register('copyApksToCommonFolder') {
    group = "build"
    description = "Copy built APKs to common AndroidBuilds folder"

    doLast {
        def outputDir = file("D:/Works_DriveUpload/__AndroidBuilds")
        outputDir.mkdirs()

        // buildDir is redirected (see root build.gradle) to keep Drive sync
        // from churning on every build - the output path must follow it,
        // not assume the default "<module>/build" location.
        def apkFiles = fileTree("${buildDir}/outputs/apk") {
            include "**/*.apk"
        }

        apkFiles.each { apkFile ->
            copy {
                from apkFile
                into outputDir
            }
            println "Copied APK to: ${new File(outputDir, apkFile.name).absolutePath}"
        }
    }
}

// Make assemble tasks depend on copy task
afterEvaluate {
    tasks.findByName('assembleDebug')?.finalizedBy 'copyApksToCommonFolder'
    tasks.findByName('assembleRelease')?.finalizedBy 'copyApksToCommonFolder'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    testImplementation 'junit:junit:4.13.2'
}

// Bundles the root CHANGELOG.md into assets so an in-app "what's new" view
// (if added later) always ships with what's currently committed.
tasks.register('copyChangelog', Copy) {
    from "${rootDir}/CHANGELOG.md"
    into "${projectDir}/src/main/assets"
}

tasks.register('publishReleaseToGitHub', Exec) {
    workingDir "${rootDir}"
    commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'publish_release.ps1'
}

tasks.register('bumpVersionForNextBuild') {
    doLast {
        def next = appVersionCode + 1
        versionPropsFile.text = "versionMajor=${appVersionMajor}\nversionCode=${next}\n"
        println "Bumped versionCode ${appVersionCode} -> ${next} (next build will be ${appVersionMajor}.${String.format('%03d', next)})"
    }
}

afterEvaluate {
    tasks.named('preBuild').configure {
        dependsOn 'copyChangelog'
    }
    tasks.named('assembleRelease').configure {
        finalizedBy 'publishReleaseToGitHub'
    }
    tasks.named('publishReleaseToGitHub').configure {
        finalizedBy 'bumpVersionForNextBuild'
    }
    tasks.named('bumpVersionForNextBuild').configure {
        onlyIf { tasks.named('publishReleaseToGitHub').get().state.failure == null }
    }
}
